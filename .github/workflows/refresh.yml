          def _safe(err):
              # ข้อความ error อาจยกค่าในเซลล์มาด้วย — ตัดทุกอย่างที่อาจเป็นเนื้อหาแชทหรือ ID ไฟล์ออกก่อนพิมพ์
              s = str(err)
              s = re.sub(r'"(?:[^"\\]|\\.)*"', '"…"', s)
              s = re.sub(r"'(?:[^'\\]|\\.)*'", "'…'", s)
              s = re.sub(r'[฀-๿]+', '…', s)
              s = re.sub(r'[A-Za-z0-9_\-]{25,}', '<id>', s)
              return s[:220]


          def log(*a):
