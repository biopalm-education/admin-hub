                  raise BackupError('ค้นหา "%s" ใน Drive ไม่เจอสักไฟล์ — ไม่สร้างไฟล์ใหม่เพื่อกันไฟล์ซ้ำ' % FB_QUERY)
              same = [x for x in found if x.get('name') == name]
              if len(same) > 1:
                  log('   พบชื่อ "%s" %d ไฟล์ — ใช้ไฟล์ที่แก้ไขล่าสุด' % (name, len(same)))
              if same:
                  return same[0]['id'], name, False
              folder = None
              for x in found:                       # โฟลเดอร์เดียวกับชีตเดือนก่อน ๆ
                  try:
                      d = call('GOOGLEDRIVE_GET_FILE_METADATA', {'fileId': x['id'], 'fields': 'id,parents'}, tries=2)
                      ps = d.get('parents') or []
                      if ps:
                          folder = ps[0]
                          break
                  except BackupError:
                      continue
              args = {'title': name}
              if folder:
                  args['folder_id'] = folder
              d = call('GOOGLESHEETS_CREATE_GOOGLE_SHEET1', args, tries=1)   # ห้ามลองซ้ำ — อาจได้ไฟล์ซ้ำ
              sid = _find_id(d)
              if not sid:
                  raise BackupError('สร้างสเปรดชีต FB ใหม่แล้วแต่ไม่ได้ ID กลับมา')
              log('   สร้างสเปรดชีตใหม่ "%s"%s' % (name, '' if folder else ' (ไม่พบโฟลเดอร์เดิม — อยู่หน้าแรกของ Drive)'))
              # แท็บแรกที่ Google สร้างให้ → เปลี่ยนชื่อเป็น สรุปรายแชท
              first = None
              for s in d.get('sheets') or []:
                  p = s.get('properties') or {}
                  if p.get('index', 0) == 0:
                      first = p.get('sheetId')
              if first is None:
                  t = tabs_of(sid)
                  first = sorted(t.values(), key=lambda v: v['index'])[0]['id'] if t else None
              if first is not None:
                  try:
                      call('GOOGLESHEETS_UPDATE_SHEET_PROPERTIES', {
                          'spreadsheetId': sid,
                          'updateSheetProperties': {'properties': {'sheetId': first, 'title': 'สรุปรายแชท',
                                                                   'gridProperties': {'frozenRowCount': 1}},
                                                    'fields': 'title,gridProperties.frozenRowCount'}}, tries=2)
                  except BackupError as e:
                      log('   เปลี่ยนชื่อแท็บแรกไม่สำเร็จ (ไม่กระทบข้อมูล):', e)
              return sid, name, True


          def _pct(a, b):
              return ('%.1f%%' % (100.0 * a / b)) if b else '—'


          def fb_overview(g, mo, agg, sumrows, upto):
              fmt = g['fmt']
              label = '%s %s' % (g['MLABEL'][int(mo[5:7])], mo[:4])
              L, T = agg.get('leads', 0), agg.get('threads', 0)
              mix = agg.get('mix') or {}
              tot = sum(mix.values()) or 1
              inbound = mix.get('na', 0) + mix.get('nc', 0) + mix.get('no', 0) + mix.get('rb', 0)
              who = agg.get('who') or {}
