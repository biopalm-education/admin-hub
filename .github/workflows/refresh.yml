name: refresh-dashboard

# อัปเดต Facebook + Instagram ขึ้น GitHub Pages — รันบนเซิร์ฟเวอร์ GitHub ทั้งหมด
# ไม่ใช้เครื่องผู้ใช้ ไม่ใช้ Composio workbench ไม่ดึง credential จาก Google Drive
#
# secrets (Settings > Secrets and variables > Actions):
#   ADMIN_SECRET      ค่าในไฟล์ admin_secret.txt เดิม (รูปแบบ user:password)
#   COMPOSIO_API_KEY  MCP consumer key ck_... จากหน้า API Key ของ Composio
#   ADMIN_GH_TOKEN    gh_token.txt เดิม (ช่วยให้ GitHub Pages rebuild แน่นอน)
#
# ไฟล์นี้ self-contained: เขียน ci_run.py + composio_shim.py + sheets_backup.py ออกมาตอนรัน
# refresh.py และกฎการจัดหมวดใน repo ไม่ถูกแก้เลย
#
# หลัง push แล้วสำรองแชทชุดเดียวกันลง Google Sheets (ผ่าน Composio ตัวเดิม ไม่ต้องตั้ง secret เพิ่ม)
#   FB: "Biopalm FB Chat Log — <เดือน> <ปี>" แยกไฟล์ละเดือน (ไม่มี = สร้างในโฟลเดอร์เดียวกับเดือนก่อน)
#   IG: "Biopalm IG Chat Log — ..." แท็บ สรุปรายแชท ทุกเดือน + ข้อความดิบ (<เดือน> <ปี>)
#   ปิดได้ด้วย repository variable SHEETS_BACKUP=0 · เดือนก่อน ก.ย. 2026 ไม่แตะ

on:
  schedule:
    - cron: '20 23 * * *'        # 06:20 น. เวลาไทย ทุกวัน
  workflow_dispatch:
    inputs:
      months:
        description: 'เดือนที่จะดึง คั่นด้วย comma เช่น 2026-08,2026-09 (เว้นว่าง = เดือนปัจจุบันตามเวลาไทย)'
        required: false
        default: ''
      mode:
        description: 'selftest = เช็ค secret + MCP อย่างเดียว ไม่แตะข้อมูล | refresh = ดึงจริงแล้ว push'
        required: false
        default: 'refresh'
        type: choice
        options:
          - refresh
          - selftest
      debug:
        description: 'พิมพ์คำตอบดิบจาก MCP (ใช้ตอนหาสาเหตุ)'
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150         # ก.ย. จริง: FB 24 + IG 7 + Sheets ~10 นาทีต่อเดือน · จันทร์/วันที่ 1 ดึง 2 เดือน
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: ติดตั้ง dependency
        run: pip install --quiet --disable-pip-version-check requests cryptography

      - name: เขียนสคริปต์ช่วย
        run: |
          mkdir -p tools/auto
          cat > tools/auto/composio_shim.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          """run_composio_tool ที่คุยกับ Composio MCP server ตรง ๆ (ใช้ใน GitHub Actions)

          ไม่ใช้ composio SDK เพราะ key ของบัญชีนี้เป็น MCP consumer key (ck_...)
          ซึ่งส่งใน header x-consumer-api-key ไม่ใช่ x-api-key ของ platform API

          สัญญาเหมือน helper ของ workbench ทุกประการ:
              run_composio_tool(slug, arguments) -> (res, err)
              res['data'] คือ payload ของ tool, err เป็น '' เมื่อสำเร็จ
          refresh.py จึงเรียกใช้ได้โดยไม่ต้องแก้อะไรเลย
          """
          import os, re, json, time, threading
          import requests

          MCP_URL = os.environ.get('COMPOSIO_MCP_URL') or 'https://connect.composio.dev/mcp'
          _KEY = (os.environ.get('COMPOSIO_API_KEY') or '').strip()
          DEBUG = bool(os.environ.get('MCP_DEBUG'))

          _sess = None
          _lock = threading.Lock()
          # refresh.py ยิง IG พร้อมกัน 6 thread — Composio ตอบพลาดราว 20% (29 ก.ย.)
          # จำกัดให้ยิงพร้อมกันไม่เกิน 3 และจดสาเหตุที่พลาดไว้รายงานท้ายรอบ
          _gate = threading.BoundedSemaphore(int(os.environ.get('MCP_PARALLEL') or 3))
          FAILS = {}


          class _MCP(object):
              # เซิร์ฟเวอร์รับ key ได้หลายทาง ลองไล่จนกว่าจะผ่าน แล้วจำไว้ใช้ต่อ
              AUTH_MODES = ('both', 'consumer', 'bearer')

              def __init__(self, url, key):
                  self.url = url
                  self.key = key
                  self.sid = None
                  self.rid = 0
                  self.tools = set()
                  self.last_raw = ''
                  self.last_reason = ''
                  self.auth_ok = ''
                  self.auth_mode = 'both'

              def _headers(self):
                  h = {'Content-Type': 'application/json',
                       'Accept': 'application/json, text/event-stream'}
                  if self.auth_mode in ('both', 'consumer'):
                      h['x-consumer-api-key'] = self.key
                  if self.auth_mode in ('both', 'bearer'):
                      h['Authorization'] = 'Bearer ' + self.key
                  if self.sid:
                      h['Mcp-Session-Id'] = self.sid
                  return h

              def _post(self, payload, timeout=180):
                  r = requests.post(self.url, json=payload, headers=self._headers(), timeout=timeout)
                  for k in ('Mcp-Session-Id', 'mcp-session-id'):
                      if r.headers.get(k):
                          self.sid = r.headers[k]
                          break
                  self.last_raw = (r.text or '')[:4000]
                  self.last_reason = r.headers.get('x-mcp-auth-failure-reason') or ''
                  if r.status_code >= 400:
                      raise RuntimeError('HTTP %d%s: %s' % (
                          r.status_code,
                          (' [' + self.last_reason + ']') if self.last_reason else '',
                          (r.text or '')[:300]))
                  return self._decode(r)

              @staticmethod
              def _decode(r):
                  # อ่าน SSE ตามสเปก: บรรทัด data: ที่ติดกันในเหตุการณ์เดียวต้องต่อกันด้วย \n
                  # (ตัวอ่านเดิมอ่านทีละบรรทัด คำตอบก้อนใหญ่ที่ถูกแบ่งหลายบรรทัดจึงหายเป็น None)
                  # และเลือกข้อความที่มี result/error ไม่ใช่ notification ที่มาทีหลัง
                  body = r.text or ''
                  ctype = r.headers.get('content-type') or ''
                  if 'text/event-stream' not in ctype:
                      if not body.strip():
                          raise RuntimeError('คำตอบว่าง (content-type=%s)' % ctype[:40])
                      return json.loads(body)
                  msgs, data, stat = [], [], {'events': 0, 'data_lines': 0, 'bad': 0, 'names': []}

                  def flush():
                      if not data:
                          return
                      stat['events'] += 1
                      chunk = '\n'.join(data)
                      del data[:]
                      if not chunk.strip() or chunk.strip() == '[DONE]':
                          return
                      try:
                          msgs.append(json.loads(chunk))
                      except Exception:
                          stat['bad'] += 1

                  for line in body.split('\n'):
                      line = line.rstrip('\r')
                      if line == '':
                          flush()
                      elif line.startswith('data:'):
                          v = line[5:]
                          data.append(v[1:] if v.startswith(' ') else v)
                          stat['data_lines'] += 1
                      elif line.startswith('event:') and len(stat['names']) < 5:
                          stat['names'].append(line[6:].strip()[:20])
                  flush()
                  for m in reversed(msgs):
                      if isinstance(m, dict) and ('result' in m or 'error' in m):
                          return m
                  # ไม่พบคำตอบ: บอกแค่โครง (ไม่มีเนื้อหาแชท) เพื่อหาสาเหตุต่อ
                  raise RuntimeError('SSE ไม่มีคำตอบ JSON-RPC: bytes=%d events=%d data_lines=%d parse_fail=%d msgs=%d event_names=%s' % (
                      len(body), stat['events'], stat['data_lines'], stat['bad'], len(msgs), stat['names']))

              def _rpc(self, method, params=None, timeout=180):
                  self.rid += 1
                  req = {'jsonrpc': '2.0', 'id': self.rid, 'method': method}
                  if params is not None:
                      req['params'] = params
                  resp = self._post(req, timeout=timeout)
                  if not isinstance(resp, dict):
                      raise RuntimeError('คำตอบไม่ใช่ JSON-RPC: %s' % str(resp)[:200])
                  if resp.get('error'):
                      raise RuntimeError('JSON-RPC error: %s' % json.dumps(resp['error'])[:300])
                  return resp.get('result') or {}

              def connect(self):
                  init = {
                      'protocolVersion': '2025-06-18',
                      'capabilities': {},
                      'clientInfo': {'name': 'admin-hub-ci', 'version': '1.0'},
                  }
                  errs = []
                  for mode in self.AUTH_MODES:
                      self.auth_mode = mode
                      self.sid = None
                      try:
                          self._rpc('initialize', init, timeout=60)
                          self.auth_ok = mode
                          break
                      except Exception as e:
                          errs.append('%s -> %s' % (mode, str(e)[:200]))
                  else:
                      raise RuntimeError('ล็อกอิน MCP ไม่ผ่านทุกวิธี:\n  ' + '\n  '.join(errs))
                  try:
                      self._post({'jsonrpc': '2.0', 'method': 'notifications/initialized'}, timeout=60)
                  except Exception:
                      pass
                  try:
                      cur = None
                      for _ in range(10):
                          p = {'cursor': cur} if cur else {}
                          res = self._rpc('tools/list', p, timeout=60)
                          for t in (res.get('tools') or []):
                              if t.get('name'):
                                  self.tools.add(t['name'])
                          cur = res.get('nextCursor')
                          if not cur:
                              break
                  except Exception as e:
                      if DEBUG:
                          print('tools/list ไม่สำเร็จ:', e)
                  return self

              def call(self, name, arguments, timeout=60):
                  res = self._rpc('tools/call', {'name': name, 'arguments': arguments}, timeout=timeout)
                  if res.get('isError'):
                      raise RuntimeError('tool error: %s' % json.dumps(res)[:300])
                  sc = res.get('structuredContent')
                  if isinstance(sc, dict) and sc:
                      return sc
                  for part in (res.get('content') or []):
                      if part.get('type') == 'text' and part.get('text'):
                          try:
                              return json.loads(part['text'])
                          except Exception:
                              return {'_text': part['text']}
                  return res


          def _client():
              global _sess
              with _lock:
                  if _sess is None:
                      if not _KEY:
                          raise RuntimeError('ไม่พบ COMPOSIO_API_KEY — ตั้งเป็น repo secret ก่อน')
                      _sess = _MCP(MCP_URL, _KEY).connect()
                  return _sess


          def _drop(c):
              # รีเซ็ต session เฉพาะตัวที่พัง — refresh.py ยิง IG พร้อมกัน 6 thread
              global _sess
              with _lock:
                  if _sess is c:
                      _sess = None


          _TOK = re.compile(r'(access_token=)[^&\s"\']+|\b(?:EAA|IGAA|IGQ)[A-Za-z0-9_\-]{20,}')


          def redact(obj):
              # ห้าม token หลุดลง log — repo นี้เป็น public (รวม token ที่ฝังอยู่ในลิงก์ paging.next ของ IG)
              if isinstance(obj, dict):
                  return {k: ('***' if 'token' in str(k).lower() else redact(v)) for k, v in obj.items()}
              if isinstance(obj, list):
                  return [redact(x) for x in obj]
              if isinstance(obj, str):
                  return _TOK.sub(lambda m: (m.group(1) or '') + '***', obj)
              return obj


          def _dig(obj, slug):
              """ดึง payload ของ tool ออกมาจากคำตอบที่อาจถูกห่อหลายชั้น"""
              if not isinstance(obj, dict):
                  return None, 'คำตอบไม่ใช่ dict'
              res = obj.get('results')
              if res is None and isinstance(obj.get('data'), dict):
                  res = obj['data'].get('results')
              if isinstance(res, list) and res:
                  item = None
                  for x in res:
                      if isinstance(x, dict) and x.get('tool_slug') == slug:
                          item = x
                          break
                  item = item or res[0]
                  if isinstance(item, dict):
                      if isinstance(item.get('response'), dict):
                          item = item['response']
                      if item.get('error'):
                          return None, str(item['error'])[:300]
                      if item.get('successful') is False:
                          return None, 'tool reported failure'
                      if 'data' not in item:
                          return None, 'ไม่พบ data ในคำตอบ'
                      return {'data': item['data']}, ''
              if obj.get('error'):
                  return None, str(obj['error'])[:300]
              if isinstance(obj.get('data'), dict) and ('response' in obj['data'] or 'results' in obj['data']):
                  return _dig(obj['data'], slug)
              if isinstance(obj.get('response'), dict):
                  r = obj['response']
                  if r.get('error') or r.get('successful') is False:
                      return None, str(r.get('error') or 'tool reported failure')[:300]
                  if 'data' in r:
                      return {'data': r['data']}, ''
              if 'data' in obj:
                  return {'data': obj['data']}, ''
              return {'data': obj}, ''


          def run_composio_tool(tool_slug, arguments, retry_params=None, print_schema_for_tool=False, *, account=None):
              with _gate:
                  out, err = _run(tool_slug, arguments, retry_params)
              if err:
                  with _lock:
                      n, _ = FAILS.get(tool_slug, (0, ''))
                      FAILS[tool_slug] = (n + 1, redact(err)[:200])
              return out, err


          def _run(tool_slug, arguments, retry_params=None):
              tries = int((retry_params or {}).get('max_retries', 4)) or 1
              delay = float((retry_params or {}).get('delay_ms', 3000)) / 1000.0
              last = 'unknown error'
              args = dict(arguments or {})
              # หน้าละ 25 ข้อความแทน 100 — คำตอบก้อนเล็กลงเมื่อผ่าน MCP · refresh.py ไล่ cursor ต่อเองจนครบเหมือนเดิม
              if tool_slug == 'INSTAGRAM_LIST_ALL_MESSAGES' and int(args.get('limit') or 0) > 25:
                  args['limit'] = 25
              t0 = time.time()
              for i in range(tries):
                  try:
                      c = None
                      c = _client()
                      if tool_slug in c.tools:
                          raw = c.call(tool_slug, args)
                      else:
                          raw = c.call('COMPOSIO_MULTI_EXECUTE_TOOL', {
                              'tools': [{'tool_slug': tool_slug, 'arguments': args}],
                              'sync_response_to_workbench': False,
                          })
                      if DEBUG:
                          print('RAW[%s]: %s' % (tool_slug, json.dumps(redact(raw), ensure_ascii=False)[:1500]))
                      out, err = _dig(raw, tool_slug)
                      if out is not None:
                          return out, ''
                      last = err or 'แกะคำตอบไม่ได้'
                  except Exception as e:
                      last = '%s หลัง %.0f วินาที: %s' % (type(e).__name__, time.time() - t0, str(e)[:300])
                      if c is not None:
                          _drop(c)
                  if i + 1 < tries:
                      time.sleep(delay * (2 ** i))          # 3, 6, 12, 24 วินาที
              return {}, last
          PYEOF
          cat > tools/auto/ci_run.py <<'PYEOF'
          # -*- coding: utf-8 -*-
          """จุดเริ่มของรอบอัปเดตใน GitHub Actions

          ไม่แก้ refresh.py เลย — แค่เตรียมของให้ครบแล้ว exec ไฟล์เดิม
            1. เขียน credential จาก env (GitHub secrets) ลง /tmp ตามที่ refresh.py คาดไว้
            2. ยัด run_composio_tool เวอร์ชัน MCP เข้าไปใน namespace แทน helper ของ workbench
            3. เลือกเดือน: MONTHS ถ้ามี, ไม่งั้นเดือนปัจจุบันตามเวลาไทย
               วันจันทร์เติมเดือนก่อนหน้าให้ด้วย ตามกฎใน tools/auto/README.md
               และวันที่ 1 ของเดือนด้วย เพื่อปิดยอดวันสุดท้ายของเดือนก่อนให้ครบทันที
               (ยอดปิดจำนวนมากเกิดในเดือนถัดไป ถ้าไม่ดึงซ้ำยอดเดือนก่อนจะต่ำกว่าจริงถาวร)

          หลัง push สำเร็จ สำรองแชทชุดเดียวกันลง Google Sheets (sheets_backup.py)
            ถ้าสำรองไม่ผ่าน หน้าเว็บยังอัปเดตแล้ว แต่รอบนี้จะขึ้น failed ให้ GitHub ส่งอีเมลเตือน
            ปิดการสำรองได้ด้วย repository variable SHEETS_BACKUP=0

          MODE=selftest เช็ค secret + MCP แล้วออก ไม่แตะข้อมูลและไม่ push
          """
          import os, sys, json, datetime as dt

          HERE = os.path.dirname(os.path.abspath(__file__))
          sys.path.insert(0, HERE)
          TH = dt.timezone(dt.timedelta(hours=7))


          def _need(name):
              v = (os.environ.get(name) or '').strip()
              if not v:
                  sys.exit('ขาด secret: %s — ตั้งใน Settings > Secrets and variables > Actions' % name)
              return v


          def _write_creds():
              with open('/tmp/gh_token.txt', 'w', encoding='utf-8') as f:
                  f.write(_need('GH_TOKEN'))
              with open('/tmp/admin_secret.txt', 'w', encoding='utf-8') as f:
                  f.write(_need('ADMIN_SECRET'))
              os.chmod('/tmp/gh_token.txt', 0o600)
              os.chmod('/tmp/admin_secret.txt', 0o600)


          def _months():
              raw = (os.environ.get('MONTHS') or '').strip()
              if raw:
                  out = []
                  for m in raw.replace(' ', '').split(','):
                      if not m:
                          continue
                      dt.datetime.strptime(m, '%Y-%m')      # ตรวจรูปแบบ ผิดแล้วหยุดทันที
                      if m not in out:
                          out.append(m)
                  return out
              now = dt.datetime.now(TH)
              cur = now.strftime('%Y-%m')
              if now.weekday() == 0 or now.day == 1:        # จันทร์ / วันที่ 1 = เติมเดือนก่อนหน้า
                  first = now.replace(day=1)
                  prev = (first - dt.timedelta(days=1)).strftime('%Y-%m')
                  return [prev, cur]
              return [cur]


          def _selftest():
              import composio_shim as S
              ok = True
              for name in ('GH_TOKEN', 'ADMIN_SECRET', 'COMPOSIO_API_KEY'):
                  v = (os.environ.get(name) or '').strip()
                  print('secret %-16s %s' % (name, 'พบ (%d ตัวอักษร)' % len(v) if v else 'ไม่พบ'))
                  ok = ok and bool(v)
              print('MCP URL =', S.MCP_URL)
              print('เดือนที่จะดึงถ้ารันจริง:', _months())
              print('')

              try:
                  c = S._client()
                  print('เชื่อมต่อ MCP สำเร็จ · วิธี auth ที่ผ่าน =', c.auth_ok, '· session =', 'มี' if c.sid else 'ไม่มี')
                  names = sorted(c.tools)
                  print('tool ที่เซิร์ฟเวอร์เปิดให้ (%d ตัว):' % len(names))
                  for n in names[:60]:
                      print('   -', n)
                  if len(names) > 60:
                      print('   ... และอีก', len(names) - 60)
              except Exception as e:
                  print('เชื่อมต่อ MCP ไม่สำเร็จ:', type(e).__name__, str(e)[:500])
                  print('RAW:', getattr(getattr(S, "_sess", None), 'last_raw', '')[:300])
                  return False
              print('')

              res, err = S.run_composio_tool('FACEBOOK_GET_USER_PAGES', {})
              pages = ((res.get('data') or {}).get('data') or []) if isinstance(res.get('data'), dict) else []
              print('FACEBOOK_GET_USER_PAGES:', err or 'OK', '| pages =', len(pages),
                    '| มี access_token =', bool(pages and isinstance(pages[0], dict) and pages[0].get('access_token')))
              if err or not pages:
                  print('   โครงคำตอบที่ได้:', json.dumps(S.redact(res), ensure_ascii=False)[:1200])
                  ok = False

              res2, err2 = S.run_composio_tool(
                  'INSTAGRAM_LIST_ALL_CONVERSATIONS', {'limit': 1, 'fields': 'id,updated_time'})
              convs = ((res2.get('data') or {}).get('data') or []) if isinstance(res2.get('data'), dict) else []
              print('INSTAGRAM_LIST_ALL_CONVERSATIONS:', err2 or 'OK', '| conversations =', len(convs))
              if err2 or not convs:
                  print('   โครงคำตอบที่ได้:', json.dumps(S.redact(res2), ensure_ascii=False)[:1200])
                  ok = False

              res3, err3 = S.run_composio_tool('GOOGLESHEETS_SEARCH_SPREADSHEETS', {
                  'query': 'Biopalm', 'search_type': 'name', 'max_results': 50})
              d3 = res3.get('data') if isinstance(res3.get('data'), dict) else {}
              print('GOOGLESHEETS_SEARCH_SPREADSHEETS:', err3 or 'OK', '| พบสเปรดชีต Biopalm… =',
                    len(d3.get('spreadsheets') or []), '(ใช้ตอนสำรองแชทลง Google Sheets)')

              print('\nselftest:', 'ผ่าน — รัน mode=refresh ได้' if ok else 'ไม่ผ่าน — ส่ง log นี้ให้ Claude')
              return ok


          def main():
              mode = (os.environ.get('MODE') or 'refresh').strip()
              if mode == 'selftest':
                  sys.exit(0 if _selftest() else 1)

