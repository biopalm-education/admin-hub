          def backup_fb(g, mo, cap, upto):
              if 'cols' not in cap or 'agg' not in cap:
                  raise BackupError('ไม่มีข้อมูล FB ของเดือนนี้ในรอบนี้')
              sumrows, extra, msgrows, mix = cap['cols']
              agg = cap['agg']
              short = g['MSHORT'][int(mo[5:7])]
              y, m = int(mo[:4]), int(mo[5:7])
              last = (dt.date(y + (m == 12), (m % 12) + 1, 1) - dt.timedelta(days=1)).day
              cat = {}
              try:
                  f = json.load(open('%s/src/fb_%s.json' % (g['REPO'], mo), encoding='utf-8'))
                  for c in f.get('chats') or []:
                      if len(c) > 37 and c[37]:
                          cat[str(c[19])] = c[37]
              except Exception as e:
                  log('   อ่านหมวดจาก fb_%s.json ไม่ได้ (คอลัมน์ U จะว่าง): %s' % (mo, type(e).__name__))
              sid, name, new = fb_sheet(g, mo)
              log('FB %s → "%s"%s' % (mo, name, ' (ใหม่)' if new else ''))
              tabs = tabs_of(sid)
              S1 = [FB_SUM_HEAD]
              for r in sumrows:
                  tid = str(r[1])
                  k = cat.get(tid[2:] if tid.startswith('t_') else tid, '')
                  S1.append(list(r) + [FB_CAT.get(k, k)])
              order = {str(r[1]): i for i, r in enumerate(sumrows)}
              msgs = sorted(msgrows, key=lambda r: (order.get(str(r[1]), 10 ** 9), str(r[1]), int(r[4])))
              parts = [('ข้อความ part 1 (1-10 %s)' % short, 1, 10), ('ข้อความ part 2 (11-20 %s)' % short, 11, 20),
                       ('ข้อความ part 3 (21-%d %s)' % (last, short), 21, last)]
              put_tab(sid, tabs, 'สรุปรายแชท', S1)
              counts = []
              for t, a, b in parts:
                  rows = [FB_MSG_HEAD] + [r for r in msgs if a <= int(str(r[5])[:2]) <= b]
                  put_tab(sid, tabs, t, rows)
                  counts.append((t, len(rows) - 1))
              put_tab(sid, tabs, 'สรุปภาพรวม', fb_overview(g, mo, agg, sumrows, upto))
              put_tab(sid, tabs, 'คำอธิบาย', fb_notes(g, mo, counts, len(sumrows), upto))
              return '%s: %s แชท / %s ข้อความ' % (name, format(len(sumrows), ','), format(len(msgrows), ','))


