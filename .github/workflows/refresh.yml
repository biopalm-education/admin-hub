          def ig_sheet():
              sid = (os.environ.get('IG_SHEET_ID') or '').strip()
              if sid:
                  return sid, 'IG_SHEET_ID'
              found = search(IG_PREFIX)
              for x in found:                         # เรียงแก้ไขล่าสุดก่อน · เลือกไฟล์ที่มีแท็บสรุปรายแชท ทุกเดือน
                  try:
                      if IG_SUM in tabs_of(x['id']):
                          return x['id'], x.get('name') or IG_PREFIX
                  except BackupError:
                      continue
              raise BackupError('ไม่พบสเปรดชีต "%s…" ที่มีแท็บ %s' % (IG_PREFIX, IG_SUM))


          def ig_rows(g, mo, IG, cap):
              TH_ = g['TH']
              fmt = g['fmt']
              short = g['MSHORT'][int(mo[5:7])]
              rows = list(((IG.get('months') or {}).get(mo) or {}).get('leads') or [])
              rows.sort(key=lambda r: ((r[18][0][0] if r[18] else 10 ** 9), str(r[19])))
              D = IG.get('dict') or []
              MS = (cap or (None, {}))[1] or {}

              def th(s):
                  return dt.datetime.strptime(s, '%Y-%m-%dT%H:%M:%S%z').astimezone(TH_)

              summ, raw, fallback = [], [], 0
              y, m = int(mo[:4]), int(mo[5:7])
              for r in rows:
                  k = r[37] if len(r) > 37 else ''
                  catl = IG_CAT.get(k, k or '')
                  nm = r[0] or ''
                  summ.append([short, ('@' + nm) if nm else '', r[1], r[2], r[13] or '—', int(r[3]), r[4], r[6], r[7], r[8],
                               r[9], fmt(r[10]) if (r[10] is not None and r[10] >= 0) else '—',
                               fmt(r[11]) if r[11] is not None else '—', 'Y' if r[12] else '', 'Y' if r[15] else '',
                               'Y' if r[16] else '', 'Y' if r[17] else '', r[14] if r[14] and r[14] >= 2 else '', catl])
                  tid = str(r[19])
                  ms = sorted([x for x in MS.get(tid, []) if x.get('created_time') and th(x['created_time']).strftime('%Y-%m') == mo],
                              key=lambda x: x['created_time'])
                  stg = IG_STG.get(r[1], r[1])
                  if len(ms) == len(r[18]):
                      for i, (x, e) in enumerate(zip(ms, r[18]), 1):
                          tx = (x.get('message') or '').strip()
                          att = ('ไฟล์แนบ' if x.get('attachments') else 'ตอบกลับสตอรี่' if x.get('story') else
                                 'แชร์โพสต์' if x.get('shares') else ('' if tx else 'ไม่รองรับ'))
                          raw.append([tid, nm, stg, i, th(x['created_time']).strftime('%d/%m %H:%M:%S'),
                                      IG_WHO.get(e[1], str(e[1])), tx, att, catl])
                  else:                                # ไม่มีข้อความดิบครบ → ใช้ข้อความในไฟล์แดชบอร์ด (เวลาละเอียดถึงนาที)
                      fallback += 1
                      for i, e in enumerate(r[18], 1):
                          t = D[e[2]] if isinstance(e[2], int) and 0 <= e[2] < len(D) else str(e[2])
                          t = t.replace('\x01', nm)
                          att = {'[ไฟล์แนบ]': 'ไฟล์แนบ', '[ตอบกลับสตอรี่]': 'ตอบกลับสตอรี่', '[แชร์โพสต์]': 'แชร์โพสต์',
                                 '[ข้อความที่ IG ไม่รองรับ]': 'ไม่รองรับ'}.get(t, '')
                          d0, mi = divmod(int(e[0]), 1440)
                          raw.append([tid, nm, stg, i, '%02d/%02d %02d:%02d:00' % (d0 + 1, m, mi // 60, mi % 60),
                                      IG_WHO.get(e[1], str(e[1])), '' if att else t, att, catl])
              return summ, raw, fallback


          def backup_ig(g, mo, cap):
              IG = json.load(open('%s/src/ig_all.json' % g['REPO'], encoding='utf-8'))
              summ, raw, fallback = ig_rows(g, mo, IG, cap)
              if not summ:
                  return 'IG %s: ไม่มีแชท — ข้าม' % mo
              short = g['MSHORT'][int(mo[5:7])]
              sid, name = ig_sheet()
              log('IG %s → "%s"' % (mo, name))
              tabs = tabs_of(sid)
              info = tabs[IG_SUM]
              W = max(len(IG_SUM_HEAD), min(info['cols'] or 26, 26))
              d = call('GOOGLESHEETS_BATCH_GET', {'spreadsheet_id': sid,
                                                  'ranges': ['%s!A1:%s%d' % (q(IG_SUM), col(W), max(info['rows'], 2))],
                                                  'valueRenderOption': 'UNFORMATTED_VALUE'})
              vr = (d.get('valueRanges') or [{}])[0].get('values') or []
              body = [list(r) for r in vr[1:]]
              while body and not any(str(v).strip() for v in body[-1]):
                  body.pop()
              idx = [i for i, r in enumerate(body) if r and str(r[0]).strip() == short]
              new = [r + [''] * (W - len(r)) for r in summ]
              if idx and idx == list(range(idx[0], idx[-1] + 1)):
                  start = idx[0]                                   # เดือนนี้อยู่ติดกัน → แทนที่ตรงนั้น แถวเดือนถัดไปเลื่อนตาม
                  table = new + body[idx[-1] + 1:]
              elif idx:
                  start = 0                                        # กระจัดกระจาย (มีคนเรียงตารางใหม่) → เอาออกแล้วต่อท้าย
                  table = [r for i, r in enumerate(body) if i not in set(idx)] + new
              else:
                  start = len(body)                                # เดือนใหม่ → ต่อท้าย
                  table = new
              table = [r + [''] * (W - len(r)) for r in table]
              calls, _ = write(sid, IG_SUM, table, start=2 + start)
              end_new, end_old = 1 + start + len(table), 1 + len(body)
              if end_old > end_new:
                  clear_tail(sid, IG_SUM, end_new + 1, end_old, W)
              log('   %s: เดือน %s %d แถว (เดิม %d) · ทั้งตาราง %s แถว (%d ครั้ง)' % (
                  IG_SUM, short, len(new), len(idx), format(start + len(table), ','), calls))
              rawtab = 'ข้อความดิบ (%s %s)' % (short, mo[:4])
              pos = None
              if rawtab not in tabs and 'คำอธิบาย' in tabs:
                  pos = tabs['คำอธิบาย']['index'] + 1               # ต่อจากคำอธิบาย เหมือนแท็บ ส.ค. ที่ทำไว้เดิม
              put_tab(sid, tabs, rawtab, [IG_RAW_HEAD] + raw, index=pos)
              if fallback:
                  log('   %d แชทไม่มีข้อความดิบครบ → ใช้ข้อความจากไฟล์แดชบอร์ดแทน (เวลาละเอียดถึงนาที)' % fallback)
              return '%s: %s เดือน %s %d แชท / %s ข้อความ' % (name, IG_SUM, short, len(new), format(len(raw), ','))


          def run(months, CAP, g):
              upto = dt.datetime.now(TH).strftime('%d/%m/%Y %H:%M')
              todo = [mo for mo in months if mo >= BACKUP_FROM]
              for mo in months:
                  if mo < BACKUP_FROM:
                      log('%s อยู่ก่อน %s — ไม่แตะชีตเดือนเก่าที่ทำมือไว้' % (mo, BACKUP_FROM))
              ok, done = True, []
              for mo in todo:
                  for ch, fn in (('FB', lambda: backup_fb(g, mo, CAP['fb'].get(mo) or {}, upto)),
                                 ('IG', lambda: backup_ig(g, mo, CAP['ig'].get(mo)))):
                      t0 = time.time()
                      try:
                          done.append(fn() + ' · %.0f วิ' % (time.time() - t0))
                      except Exception as e:
                          ok = False
                          why = str(e)[:400] if isinstance(e, BackupError) else _safe(e)   # BackupError กรองมาแล้ว
                          log('%s %s สำรองไม่สำเร็จ: %s %s' % (ch, mo, type(e).__name__, why))
              for x in done:
                  log('สำเร็จ ·', x)
              return ok
