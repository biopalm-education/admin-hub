          def call(slug, args, tries=3):
              res, err = S.run_composio_tool(slug, args, retry_params={'max_retries': tries, 'delay_ms': 3000})
              if err:
                  raise BackupError('%s: %s' % (slug, _safe(err)))
              d = res.get('data')
              return d if isinstance(d, dict) else {}


          def q(tab):
              return "'" + tab.replace("'", "''") + "'"


          def col(n):
              s = ''
              while n:
                  n, r = divmod(n - 1, 26)
                  s = chr(65 + r) + s
              return s


          def cell(v):
              if v is None:
                  return ''
              if isinstance(v, bool):
                  return 'Y' if v else ''
              if isinstance(v, (int, float)):
                  return v
              v = str(v)
              return v if len(v) <= 45000 else v[:45000] + ' …[ตัดเกิน 45,000 ตัวอักษร]'


          def tabs_of(sid):
              d = call('GOOGLESHEETS_GET_SPREADSHEET_INFO', {
                  'spreadsheet_id': sid,
                  'fields': 'sheets.properties(sheetId,title,index,gridProperties(rowCount,columnCount))'})
              out = {}
              for s in d.get('sheets') or []:
                  p = s.get('properties') or {}
                  if p.get('title') is not None:
                      gp = p.get('gridProperties') or {}
                      out[p['title']] = {'id': p.get('sheetId'), 'index': p.get('index', 0),
                                         'rows': int(gp.get('rowCount') or 0), 'cols': int(gp.get('columnCount') or 0)}
              return out


          def add_tab(sid, title, nrows, ncols, index=None):
              props = {'title': title, 'gridProperties': {'rowCount': max(nrows, 2), 'columnCount': ncols,
                                                          'frozenRowCount': 1}}
              if index is not None:
                  props['index'] = index
              try:
                  call('GOOGLESHEETS_ADD_SHEET', {'spreadsheet_id': sid, 'title': title, 'force_unique': False,
                                                  'properties': props}, tries=1)
              except BackupError:
                  if title not in tabs_of(sid):      # ครั้งก่อนอาจสร้างสำเร็จแต่คำตอบหลุด → มีแล้วก็ใช้ต่อ
                      raise


          def write(sid, tab, rows, start=1):
              """เขียน rows ลงแท็บตั้งแต่แถว start — แบ่งเป็นก้อน ถ้าก้อนไหนพลาดจะแบ่งให้เล็กลงแล้วลองใหม่"""
              width = max([len(r) for r in rows] or [1])
              rows = [[cell(v) for v in r] + [''] * (width - len(r)) for r in rows]
              i, n, calls, fails, streak = 0, len(rows), 0, 0, 0
              size = limit = MAX_ROWS
              bad = {}
              while i < n:
                  j = min(n, i + size)
                  while j - i > 25 and len(json.dumps(rows[i:j])) > MAX_BYTES:
                      j = i + max(25, (j - i) // 2)
                  chunk = rows[i:j]
                  rng = '%s!A%d:%s%d' % (q(tab), start + i, col(width), start + j - 1)
                  try:
                      d = call('GOOGLESHEETS_VALUES_UPDATE', {'spreadsheet_id': sid, 'range': rng,
                                                              'value_input_option': 'RAW', 'values': chunk,
                                                              'auto_expand_sheet': True}, tries=2)
                      got = d.get('updatedRows')
                      need = sum(1 for r in chunk if any(v != '' for v in r))
                      if isinstance(got, int) and got < need:
                          raise BackupError('เขียนได้ %d จาก %d แถว' % (got, need))
                  except BackupError as e:
                      # พลาด = ก้อนอาจใหญ่เกิน หรือเน็ต/Composio สะดุดชั่วคราว → แบ่งให้เล็กลงแล้วลองต่อ
                      # ยอมแพ้เมื่อพลาดติดกัน 6 ครั้งที่ตำแหน่งเดียวกัน
                      fails += 1
                      streak = 0
                      if fails >= 6:
                          raise BackupError('%s แถว %d-%d: %s' % (tab, start + i, start + j - 1, e))
                      bad[len(chunk)] = bad.get(len(chunk), 0) + 1
                      size = max(25, len(chunk) // 2)
                      if bad[len(chunk)] >= 2:          # ขนาดนี้พลาดซ้ำ = น่าจะใหญ่เกินจริง ไม่ขยายกลับไปอีก
                          limit = min(limit, size)
                      log('   %s: ก้อน %d แถวไม่ผ่าน (ครั้งที่ %d) ลองใหม่ทีละ %d แถว' % (tab, len(chunk), fails, size))
                      time.sleep(min(30, 5 * fails) * PAUSE)
                      continue
                  calls += 1
                  fails = 0
                  i = j
                  streak += 1
                  if streak >= 8 and size < limit:       # สะดุดชั่วคราวผ่านไปแล้ว → ขยายก้อนกลับ
                      size, streak = min(limit, size * 2), 0
              return calls, width


          def clear_tail(sid, tab, first_row, last_row, width):
              if last_row >= first_row:
                  call('GOOGLESHEETS_CLEAR_VALUES', {'spreadsheet_id': sid,
                                                     'range': '%s!A%d:%s%d' % (q(tab), first_row, col(width), last_row)})


          def put_tab(sid, tabs, tab, rows, index=None):
              """แท็บทั้งแท็บ = rows (รวมหัวตาราง) · ไม่มีแท็บ = สร้าง · เขียนก่อนแล้วล้างส่วนเกินท้าย"""
              if tab not in tabs:
                  add_tab(sid, tab, len(rows) + 1, max(len(r) for r in rows), index)
                  old_rows, old_cols = 0, 0
              else:
                  old_rows, old_cols = tabs[tab]['rows'], tabs[tab]['cols']
              calls, width = write(sid, tab, rows)
              if old_rows > len(rows):
                  clear_tail(sid, tab, len(rows) + 1, old_rows, old_cols or width)
              log('   %s: %s แถว (%d ครั้ง)' % (tab, format(len(rows) - 1, ','), calls))


          def search(prefix, query=None):
              d = call('GOOGLESHEETS_SEARCH_SPREADSHEETS', {'query': query or prefix, 'search_type': 'name',
                                                             'max_results': 100, 'include_trashed': False})
              return [x for x in (d.get('spreadsheets') or d.get('files') or [])
                      if isinstance(x, dict) and not x.get('trashed') and str(x.get('name') or '').startswith(prefix)]


          def _find_id(obj):
              if isinstance(obj, dict):
                  for k in ('spreadsheetId', 'spreadsheet_id'):
                      if isinstance(obj.get(k), str) and obj[k]:
                          return obj[k]
                  for v in obj.values():
                      r = _find_id(v)
                      if r:
                          return r
              elif isinstance(obj, list):
                  for v in obj:
                      r = _find_id(v)
                      if r:
                          return r
              return None


